name: check repo

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  # Keep a result for every commit on main.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  nix-fmt:
    name: Check Nix formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check Nix formatting
        run: |
          echo "nix fmt version:"
          nix fmt -- --version

          set +e
          # "nixfmt" doesn't has a nice diff output for its `--check` command,
          # therefore we use `git diff`
          find . -name "*.nix" -type f -exec nix fmt {} \+

          # Show format diff
          git --no-pager diff

          # Report error, fail pipeline job
          set -e
          git --no-pager diff --quiet

  website-build:
    name: Build static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#website

  checks:
    # Also runs all formatting checks (except for Nix itself)
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
